re club, smooth \u2014 GIR lives long, not short.",plan:[{c:"7i",a:"Center, right bias ok",t:"Right is the safe side. Smooth 74."},{c:"8i",a:"CENTER green",t:"149y = 8i, NOT 7i. The GIR lives at the number, not below it."}]},{n:12,par:4,y:349,tgt:5,gap:!1,r3:null,star:!1,vibe:"The rule keeper. One club is banned on shot two and one club is blessed \u2014 9i only, forever. The rule already paid for itself once. Honor it and this hole is a formality.",hz:"Road L (road lie) \xB7 water front-left green \xB7 8i BANNED shot 2",cue:"9i only on two \u2014 the rule already paid for itself.",plan:[{c:"7i",a:"Center fairway",t:"Road left is a road lie, not a disaster."},{c:"9i ONLY",a:"Center-left",t:"NEVER 8i here \u2014 water history. Leaves 84y."},{c:"52\xB0 \xBE",a:"Center-LEFT",t:"\xBE ceiling, confirmed. Water front-left."}]},{n:13,par:3,y:179,tgt:4,gap:!1,r3:"3-PUTT",star:!1,vibe:"The corridor of patience. Trees swallow anything high, so this par 3 is played as two low, smart shots. 8i to the zone, bump it on, and bury the 3-putt ghost.",hz:"Trees both sides ALL hole \xB7 high loft BANNED",cue:"On the green first try, two putts, four, walk.",plan:[{c:"8i",a:"Center landing zone",t:"145 \u2192 34y from pin. Two-shot par 3 by design."},{c:"PW bump",a:"Center pin \u2014 LOW",t:"INSIDE 35: hood face, punch under everything. One look, commit, ON in one."}]},{n:14,par:4,y:278,tgt:4,gap:!1,r3:"CHUNK",star:!0,vibe:"Redemption row, part two \u2014 and this one owes you. 278 yards of birdie chance that chunks stole in R3. Stand closer, take one more club, collect the debt.",hz:"Trees both sides \xB7 uphill",cue:"Stand closer, one more club \u2014 this hole owes you.",plan:[{c:"7i",a:"Center fairway",t:"Full setup. The chunk was setup drift, nothing more."},{c:"8i",a:"CENTER green",t:"138y = 8i finishing past center. Uphill kills it soft. Downhill birdie putt back."}]},{n:15,par:5,y:504,tgt:6,gap:!1,r3:null,star:!1,vibe:"The water gauntlet. 504 yards where right does not exist. Th
